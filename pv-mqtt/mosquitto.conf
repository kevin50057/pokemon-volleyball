# Pokemon Volleyball MQTT Broker
# WebSocket listener for game relay

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
acl_file C:\mosquitto-pv\acl

persistence false
max_connections 300
max_packet_size 65536
max_keepalive 120

log_dest file C:\mosquitto-pv\mosquitto.log
log_type error
log_type warning
log_type notice
